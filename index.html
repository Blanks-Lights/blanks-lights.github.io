    <title>Blanks Lights | Home</title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-dark: #0b0c10;
            --color-blue: #0062ff;
            --color-purple: #b700ff;
            --color-white: #ffffff;
            --gradient-primary: linear-gradient(135deg, var(--color-blue), var(--color-purple));
        }

        body {
            background-color: var(--bg-dark);
            color: var(--color-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        /* Header / Logo Layout */
        header {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .logo {
            max-width: 150px;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Media Section Styling with Fade Animation */
        .media-section {
            width: 100%;
            max-width: 600px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .media-section img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid transparent;
            border-image: var(--gradient-primary) 1;
            opacity: 1;
            transition: opacity 0.4s ease-in-out; /* Smooth transition animation */
        }

        .media-section img.fade-out {
            opacity: 0;
        }

        /* Main Content Container */
        main {
            max-width: 600px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* Links/Buttons Container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Interactive Modern Buttons */
        .custom-button {
            display: block;
            width: 100%;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--color-white);
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid transparent;
            border-image: var(--gradient-primary) 1;
            border-radius: 0px; 
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .custom-button:hover {
            transform: translateY(-3px);
            background: var(--gradient-primary);
            box-shadow: 0 10px 20px rgba(0, 98, 255, 0.2), 0 10px 20px rgba(183, 0, 255, 0.2);
        }

        .custom-button:active {
            transform: translateY(-1px);
        }

        /* Improved Sponsored Section Styles & Centering */
        .sponsored-section {
            width: 100%;
            max-width: 600px;
            margin-top: 3rem;
            text-align: center;
        }

        .sponsored-section p.title {
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sponsors-flex {
            display: flex;
            justify-content: center;
            align-items: center; /* Aligns all items perfectly in the vertical center */
            gap: 25px;
        }

        .sponsor-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
        }

        .sponsor-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 6px;
        }

        .sponsor-item p {
            font-size: 0.85rem;
            color: var(--color-white);
            line-height: 1.2;
        }

        .sponsor-plus {
            font-size: 1.8rem;
            font-weight: bold;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 15px; /* Fine-tunes exact vertical centering with the logos */
        }
    </style>
</head>
<body>

</body>

<script>
  // --- EASY MEDIA SLIDESHOW CONTROLLER WITH FADE ANIMATION ---
  const mediaImages = [
    "https://uploads.onecompiler.io/449drxzcm/44rb8u7r9/BL%20image%201.jpg",
    "https://uploads.onecompiler.io/449drxzcm/44rb8u7r9/xmas%20image1.png"
  ];
  
  let currentPhotoIndex = 0;
  const slideshowElement = document.getElementById("slideshow");

  // Changes photo every 2 seconds with a smooth fade effect
  setInterval(() => {
    slideshowElement.classList.add("fade-out"); // Triggers fade-out transition
    
    setTimeout(() => {
      currentPhotoIndex = (currentPhotoIndex + 1) % mediaImages.length;
      slideshowElement.src = mediaImages[currentPhotoIndex];
      slideshowElement.classList.remove("fade-out"); // Triggers fade-in transition
    }, 400); // Matches CSS transition time
    
  }, 4000);
</script>
