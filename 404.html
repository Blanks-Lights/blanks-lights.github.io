<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blanks Lights Error</title>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --color-1: #0062ff;
            --color-2: #b700ff;
            --color-white: #ffffff;
            --text-active-color: var(--color-white);
            --gradient-primary: linear-gradient(135deg, var(--color-1), var(--color-2));
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--color-white);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            max-width: 600px;
            line-height: 1.4;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-active-color);
            background: var(--gradient-primary);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <h1 style="font-size: 5rem; margin-top: -100px;">404</h1>
    <p style="font-size: 1.2rem; margin-top: -40px;">That's an error.</p>
    <h2 style="margin-top: 60px;">Looks like you in the wrong place mate or an error has occurred :(</h2>
    <a href="index.html" style="margin-top: 60px;" class="btn">Go to Blanks Lights Home</a>

</body>
</html>
