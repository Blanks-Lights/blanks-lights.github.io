<!DOCTYPE html>
<html lang="en" data-theme="christmas">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blanks Lights | Next Show Countdown</title>
    
<style>
    /* Base Reset & Variables */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* DEFAULT THEME (Blue & Purple) */
    :root {
        --bg-dark: #0b0c10;
        --color-1: #0062ff;
        --color-2: #b700ff;
        --color-white: #ffffff;
        --text-active-color: var(--color-white);
        --gradient-primary: linear-gradient(135deg, var(--color-1), var(--color-2));
    }

    /* CHRISTMAS THEME (Red, White, & Green) */
    [data-theme="christmas"] {
        --gradient-primary: linear-gradient(135deg, #ff0000, #ffffff, #00ff00);
        --text-active-color: #000000;
    }

    body {
        background-color: var(--bg-dark);
        color: var(--color-white);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
        overflow-x: hidden;
        transition: background-color 0.3s ease;
    }

    header {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 2.5rem;
    }

    .logo {
        max-width: 450px;
        width: 100%;
        height: auto;
        object-fit: contain;
        margin-bottom: 1.5rem;
    }

    main {
        max-width: 600px;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        font-size: clamp(1.8rem, 5vw, 2.3rem);
        font-weight: 700;
        margin-bottom: 2rem;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.5px;
        transition: background 0.3s ease;
        filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
    }

    .countdown-container {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        width: 100%;
        margin-bottom: 2rem;
        flex-wrap: wrap; 
    }

    .time-box {
        flex: 1;
        min-width: 70px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem 0.25rem;
        backdrop-filter: blur(4px);
    }

    .time-box span {
        font-size: clamp(1.8rem, 8vw, 2.5rem); 
        font-weight: 700;
        display: block;
        color: var(--color-white);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
    }

    .time-box p {
        font-size: clamp(0.7rem, 2.5vw, 0.8rem);
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 0.4rem;
    }

    .status-message {
        font-size: clamp(0.95rem, 3vw, 1.1rem);
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 3rem;
        line-height: 1.5;
        padding: 0 0.5rem;
    }

    .links-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }

    .custom-button {
        display: block;
        width: 100%;
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: var(--color-white);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.03);
        border: 2px solid transparent;
        border-image: var(--gradient-primary) 1;
        position: relative;
        transition: all 0.3s ease;
        cursor: pointer;
        text-align: center;
        text-shadow: 0px 1px 3px rgba(0,0,0,0.9);
    }

    .custom-button:hover,
    .custom-button.active {
        transform: translateY(-2px);
        background: var(--gradient-primary);
        color: var(--text-active-color);
        text-shadow: none;
        box-shadow: 0 5px 15px rgba(0, 98, 255, 0.15);
    }

    .custom-button:active {
        transform: translateY(-1px);
    }

    @media (max-width: 400px) {
        .time-box {
            flex: calc(50% - 0.5rem);
        }
    }
</style>
</head>
<body>

    <header>
        <img class="logo" src="https://uploads.onecompiler.io/449drxzcm/44rdv8wdj/Blanks%20lights%20black%20no%20bg.png" alt="Blanks Lights Logo">
    </header>

    <main>
        <h1 id="show-title">Loading Show Times...</h1>

        <div class="countdown-container">
            <div class="time-box">
                <span id="days">00</span>
                <p>Days</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Mins</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Secs</p>
            </div>
        </div>

        <p id="status-text" class="status-message">Calculating next run time...</p>

        <div class="links-container">
            <a href="/" class="custom-button">Return to home</a>
        </div>
    </main>

<script>
    let isCalculating = false;
    let calcTimeout = null;

    function triggerCalculationDelay(callback) {
        isCalculating = true;
        
        document.getElementById("show-title").textContent = "Loading Show Times...";
        document.getElementById("status-text").textContent = "Calculating next run time...";
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        if (calcTimeout) clearTimeout(calcTimeout);

        calcTimeout = setTimeout(function() {
            isCalculating = false;
            if (callback) callback();
        }, 500);
    }

    function getNextTarget() {
        const now = new Date();
        const currentYear = now.getFullYear();
        let target = null;
        let title = "Christmas Light Show";
        let status = "";

        target = new Date(currentYear, 11, 1, 15, 30, 0); // Dec 1
        if (now > target) {
            target.setFullYear(currentYear + 1);
        }
        status = "Starts on 1st December at 15:30.";

        return { target, title, status };
    }

    function updateCountdown() {
        if (isCalculating) return;

        const now = new Date();
        const currentYear = now.getFullYear();
        
        let targetTime = null;
        let showName = "";
        let statusString = "";

        function checkRange(startMonth, startDay, endMonth, endDay, targetYear) {
            let start = new Date(targetYear, startMonth - 1, startDay, 0, 0, 0);
            let end = new Date(targetYear, endMonth - 1, endDay, 23, 59, 59);
            if (end < start) end.setFullYear(end.getFullYear() + 1);
            return { start, end };
        }

        let christmas = checkRange(12, 1, 1, 2, currentYear);
        let christmasPrior = checkRange(12, 1, 1, 2, currentYear - 1);

        let activeSeason = null;
        if (now >= christmas.start && now <= christmas.end) activeSeason = "Christmas";
        else if (now >= christmasPrior.start && now <= christmasPrior.end) activeSeason = "Christmas";

        if (activeSeason) {
            showName = activeSeason + " Light Show";
            let startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 15, 30, 0);
            let endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 20, 0, 0);
            
            if (now < startOfToday) {
                targetTime = startOfToday;
                statusString = "Shows run every 30 minutes from 15:30 to 20:00.";
            } else if (now > endOfToday) {
                let tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                targetTime = new Date(tomorrow.getFullYear(), tomorrow.getMonth(), tomorrow.getDate(), 15, 30, 0);
                statusString = "Shows have ended for tonight. Next run starts tomorrow at 15:30.";
            } else {
                let nextSlot = new Date(now);
                nextSlot.setSeconds(0);
                nextSlot.setMilliseconds(0);
                if (nextSlot.getMinutes() < 30) nextSlot.setMinutes(30);
                else { nextSlot.setHours(nextSlot.getHours() + 1); nextSlot.setMinutes(0); }
                targetTime = nextSlot;
                statusString = `Shows loop every half hour until 20:00. Next slot: ${targetTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            }
        } else {
            let nextChristmas = checkRange(12, 1, 1, 2, currentYear).start;
            if (now > nextChristmas) nextChristmas.setFullYear(nextChristmas.getFullYear() + 1);

            showName = "Christmas Light Show Season";
            targetTime = new Date(nextChristmas.setHours(15, 30, 0));
            statusString = "Starts on 1st December at 15:30.";
        }

        document.getElementById("show-title").textContent = showName;
        document.getElementById("status-text").textContent = statusString;

        const diff = Math.max(0, targetTime - now);

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = String(d).padStart(2, '0');
        document.getElementById("hours").textContent = String(h).padStart(2, '0');
        document.getElementById("minutes").textContent = String(m).padStart(2, '0');
        document.getElementById("seconds").textContent = String(s).padStart(2, '0');
    }

    // Set 1-second interval loop
    setInterval(updateCountdown, 1000);

    // Initial page load calculation delay
    triggerCalculationDelay(updateCountdown);
</script>

</body>
</html>
